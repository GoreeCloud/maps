name: Maps validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact direct dependencies
        run: npm install --no-audit --no-fund
      - name: Node tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: Build
        run: npm run build
