name: Maps browser smoke (synthetic)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    name: Three-viewport browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application dependencies from lockfile
        run: npm ci --no-fund --no-audit
      - name: Install pinned browser test runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Build browser client
        run: npm run build
      - name: Exercise synthetic browser journeys
        env:
          MAPS_BROWSER_EVIDENCE: browser-evidence
        run: node tests/browser-review.cjs
      - name: Verify device-location callback revocation safety
        env:
          MAPS_BROWSER_EVIDENCE: browser-evidence
        run: node tests/browser-location-consent.cjs
      - name: Verify keyboard, mobile layout and high-contrast interactions
        env:
          MAPS_BROWSER_EVIDENCE: browser-evidence
        run: node tests/browser-accessibility.cjs
      - name: Verify narrow-viewport reflow (zoom equivalents)
        env:
          MAPS_BROWSER_EVIDENCE: browser-evidence
        run: node tests/browser-reflow.cjs
      - name: Prepare isolated native browser zoom tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends x11-utils xvfb libxtst6
      - name: Verify actual Chromium browser zoom (200% and 400%)
        env:
          MAPS_BROWSER_EVIDENCE: browser-evidence
        run: GC_MAPS_ISOLATED_DISPLAY=1 XDG_SESSION_TYPE=x11 GDK_BACKEND=x11 xvfb-run -a -s '-screen 0 1440x900x24' node tests/browser-native-zoom.cjs
      - name: Preserve test screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goreecloud-maps-browser-evidence
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 7
